<!DOCTYPE html>
<html>

<head>

<title>Brawl Analyzer</title>


<style>


* {
    box-sizing: border-box;
}



body {

    margin:0;
    background:#111;
    color:white;
    font-family:Arial, sans-serif;

}



/* LEFT SIDEBAR */

.left-sidebar {

    position:fixed;

    left:0;
    top:0;

    width:180px;

    height:100vh;

    background:#1b1b1b;

    padding:20px;

}



/* RIGHT SIDEBAR */

.right-sidebar {

    position:fixed;

    right:0;
    top:0;

    width:180px;

    height:100vh;

    background:#1b1b1b;

    padding:20px;

}



/* CENTER */

.main {

    margin-left:180px;

    margin-right:180px;

    padding:40px;

    min-height:100vh;

    text-align:center;

}



/* BUTTONS */


.nav-button,
.new-button {


    width:140px;

    height:45px;

    margin-bottom:15px;

    background:#333;

    color:white;

    border:none;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;


}



.nav-button:hover,
.new-button:hover {

    background:#555;

}



.active {

    background:#666;

}





/* MAPS */


.map-section {

    margin-bottom:40px;

}



.map-section h2 {

    text-align:left;

    font-size:24px;

}



.map-container {

    display:flex;

    gap:25px;

}



.map-card {

    width:160px;

}



.map-card h3 {

    text-align:center;

    font-size:16px;

}



.map-card img {


    width:160px;

    height:230px;

    object-fit:cover;

    border-radius:12px;


}

.brawler-section{

margin-bottom:40px;

}


.brawler-section h2{

text-align:left;

}



.brawler-grid{

display:grid;

grid-template-columns:repeat(9, 1fr);

gap:15px;

}



.brawler-card{

background:#222;

border-radius:12px;

padding:10px;

text-align:center;

}



.brawler-card img{

width:80px;

height:80px;

object-fit:contain;

}



.brawler-card p{

margin:5px;

font-size:14px;

}

/* POPUP BACKGROUND */

.popup-background{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.7);

justify-content:center;

align-items:center;

z-index:1000;

}



/* POPUP */

.popup{

width:850px;

min-height:600px;

background:#1f1f1f;

border-radius:18px;

padding:30px;

position:relative;

}



/* CLOSE BUTTON */

.close-button{

position:absolute;

right:20px;

top:20px;

width:40px;

height:40px;

background:#333;

border:none;

border-radius:10px;

color:white;

font-size:20px;

cursor:pointer;

}



.close-button:hover{

background:#555;

}

/* MAP AREA */


.match-map-area{

display:flex;

justify-content:center;

align-items:center;

gap:80px;

margin-top:80px;

}



/* LEFT SIDE */


.map-preview{

text-align:center;

}



#selectedMapName{

font-size:24px;

margin-bottom:15px;

}



.map-image-box{

width:220px;

height:300px;

background:#333;

border-radius:15px;

}





/* RIGHT SIDE */


.map-selector button{

width:180px;

height:50px;

background:#333;

color:white;

border:none;

border-radius:12px;

font-size:17px;

cursor:pointer;

}


.map-selector button:hover{

background:#555;

}

</style>


</head>



<body>


<div class="left-sidebar">


<button class="nav-button active" onclick="openPage('maps', this)">
Maps
</button>


<button class="nav-button" onclick="openPage('players', this)">
Players
</button>


<button class="nav-button" onclick="openPage('drafts', this)">
Drafts
</button>


<button class="nav-button" onclick="openPage('brawlers', this)">
Brawlers
</button>


</div>




<div class="main" id="content">


<!-- YOUR MAP CODE GOES HERE -->

</div>


<div class="right-sidebar">


<button class="new-button" onclick="openNewMatch()">
New
</button>

</div>

<div id="popupBackground" class="popup-background">

    <div class="popup">

        <button class="close-button" onclick="closeNewMatch()">
            ✕
        </button>


        <div class="match-map-area">


            <div class="map-preview">


                <h2 id="selectedMapName">
                    Select a map
                </h2>


                <div class="map-image-box">

                </div>


            </div>



            <div class="map-selector">


                <button id="mapButton" onclick="openMapSelector()">
                    Select a map ▼
                </button>


            </div>


        </div>


    </div>

</div>


<script src="maps.js"></script>
<script src="brawlers.js"></script>
<script src="main.js"></script>

</body>

</html>
